name: Release artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal

      - name: Select pinned toolchain
        run: rustup override set 1.97.0

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          version="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          if [[ "$version" != "2.13.2" ]]; then
            echo "release workflow certifies workspace version 2.13.2 only (got $version)" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v2.13.2" ]]; then
            echo "release workflow accepts tag v2.13.2 only (got $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=silent-nexus-$version-x86_64-unknown-linux-gnu.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Build deterministic Linux package
        run: scripts/package-release.sh

      - name: Validate packaged release
        run: scripts/validate-release.sh "dist/${{ steps.version.outputs.archive }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: silent-nexus-${{ steps.version.outputs.version }}-linux-x86-64
          path: |
            dist/${{ steps.version.outputs.archive }}
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
