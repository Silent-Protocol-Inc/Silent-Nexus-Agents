name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  linux:
    name: Rust 1.97 / Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy

      - name: Select pinned toolchain
        run: rustup override set 1.97.0

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with warnings denied
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run locked workspace tests
        run: cargo test --workspace --locked

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
