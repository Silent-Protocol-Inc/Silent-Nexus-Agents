# cargo-deny configuration for Silent Nexus.
# Run: cargo deny check
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
# Duplicate transitive versions are reviewed with `cargo tree -d` during the
# release check. They are not an independent security finding.
multiple-versions = "allow"
wildcards = "deny"
# Internal workspace crates are private path dependencies. Registry dependencies
# must still use bounded version requirements.
allow-wildcard-paths = true
# Crates we deliberately avoid; see docs/dependencies.md for rationale.
deny = [
    { crate = "openssl", reason = "rustls only; avoids system OpenSSL linkage" },
    { crate = "git2", reason = "Git runs as a controlled subprocess; libgit2 adds size and CVE surface" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
